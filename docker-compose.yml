services:
  app:
    build: .
    image: repertoire-table:latest
    container_name: repertoire-table
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      DB_PATH: /app/data/repertoire.sqlite3
    volumes:
      # Named volume: the SQLite DB survives `docker compose down`.
      - repertoire-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  repertoire-data:
