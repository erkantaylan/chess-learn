# The .NET stack. Runs alongside the Python one (repo-root docker-compose.yml, port 8000) —
# different compose project name, different host port, different volume.
#
#   docker compose -f dotnet/docker-compose.yml up --build      # http://localhost:5080
#
# For local development prefer Aspire, which supervises the same thing with a dashboard:
#   cd dotnet/src/Aspire/Repertoire.AppHost && aspire run
name: repertoire

services:

  api:
    image: repertoire.api
    build:
      # Repo root: the image copies index.html, views/ and engine/ as well as the C# projects.
      context: ..
      dockerfile: dotnet/src/Api/Repertoire.Api/Dockerfile
    ports:
      - '5080:8080'
    depends_on:
      db-repertoire:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__cs-repertoire=Host=db-repertoire;Username=postgres;Password=repertoire-local-dev;Database=repertoire;
      # --- The one account. Override both in whatever injects your production env; the app
      #     refuses to boot outside Development if either is missing.
      - Auth__Username=erkan
      - Auth__Password=change-me
    # TCP probe on Kestrel: the aspnet images ship bash but neither curl nor wget. Mercury's trick.
    # start_period covers the EF migration on first boot.
    healthcheck:
      test: [ 'CMD-SHELL', "bash -c 'echo > /dev/tcp/localhost/8080'" ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  db-repertoire:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=repertoire-local-dev
      - POSTGRES_DB=repertoire
    volumes:
      - volume_repertoire:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB' ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  volume_repertoire:
